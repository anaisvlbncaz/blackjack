<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blackjack Royale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            ♠ BLACKJACK ROYALE ♠
        </div>

        <div class="balance">
            🪙 <span id="balance">1000</span>
        </div>
    </header>

    <main>

        <h1>BLACKJACK</h1>
        <p class="subtitle">La table est ouverte</p>

        <section class="table">

            <div class="zone">
                <h2>CROUPIER</h2>

                <div id="dealer-cards" class="cards"></div>

                <div class="score">
                    Score : <span id="dealer-score">?</span>
                </div>
            </div>

            <div id="message" class="message">
                Cliquez sur « Nouvelle partie »
            </div>

            <div class="zone">
                <h2>VOUS</h2>

                <div id="player-cards" class="cards"></div>

                <div class="score">
                    Score : <span id="player-score">0</span>
                </div>
            </div>

        </section>

        <section class="controls">

            <div class="bet">
                <span>Mise</span>

                <button id="minus">−</button>

                <strong id="bet">50</strong>

                <button id="plus">+</button>
            </div>

            <div class="buttons">

                <button id="new-game" class="gold">
                    NOUVELLE PARTIE
                </button>

                <button id="hit" disabled>
                    TIRER
                </button>

                <button id="stand" disabled>
                    RESTER
                </button>

            </div>

        </section>

        <section class="history">

            <h3>HISTORIQUE</h3>

            <div id="history">
                Aucune partie pour le moment.
            </div>

        </section>

    </main>

    <footer>
        BLACKJACK ROYALE · JETONS VIRTUELS
    </footer>

    <script src="script.js"></script>

</body>
</html>
